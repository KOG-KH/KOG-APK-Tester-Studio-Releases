    <text x="210" y="22" fill="#94a3b8" font-size="11" font-weight="700">NỘI DUNG KIỂM TRA</text>
    <text x="450" y="22" fill="#94a3b8" font-size="11" font-weight="700">KỲ VỌNG CHUẨN (EXPECTED)</text>
    <text x="800" y="22" fill="#94a3b8" font-size="11" font-weight="700">HIỆN TRẠNG (ACTUAL)</text>
    <text x="1040" y="22" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">TRẠNG THÁI</text>

