    <text x="15" y="68" fill="#f8fafc" font-size="12" font-weight="700">P1_01</text>
    <rect x="80" y="54" width="55" height="20" rx="4" fill="#252e42"/>
    <text x="107" y="68" fill="#94a3b8" font-size="11" text-anchor="middle">splash</text>
    <text x="210" y="63" fill="#f8fafc" font-size="12" font-weight="600">Splash - Giao diện &amp; Text Ads</text>
    <text x="210" y="79" fill="#94a3b8" font-size="11">Logo + Process bar + Text Ads</text>
    <text x="450" y="68" fill="#cbd5e1" font-size="12">Hiển thị text "This action may contains ads" dưới process bar</text>
    <text x="800" y="68" fill="#6ee7b7" font-size="12">Đã tìm thấy text chuẩn trong layout strings</text>
    <rect x="1005" y="52" width="70" height="22" rx="4" fill="#064e3b" stroke="#059669"/>
    <text x="1040" y="67" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">PASS</text>

    <!-- Row 2 (PASS) -->
    <rect x="0" y="92" width="1120" height="50" fill="#161b27" rx="4"/>
    <text x="15" y="122" fill="#f8fafc" font-size="12" font-weight="700">P1_02</text>
    <rect x="80" y="108" width="55" height="20" rx="4" fill="#252e42"/>
    <text x="107" y="122" fill="#94a3b8" font-size="11" text-anchor="middle">splash</text>
    <text x="210" y="117" fill="#f8fafc" font-size="12" font-weight="600">Splash - Cấu hình Ads &amp; Flow</text>
    <text x="210" y="133" fill="#94a3b8" font-size="11">banner_splash + inter_splash</text>
    <text x="450" y="122" fill="#cbd5e1" font-size="12">Đóng inter_splash sang Language; Back không hiện welcome_back</text>
    <text x="800" y="122" fill="#6ee7b7" font-size="12">Đã cấu hình đủ ID banner_splash và inter_splash</text>
    <rect x="1005" y="106" width="70" height="22" rx="4" fill="#064e3b" stroke="#059669"/>
    <text x="1040" y="121" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">PASS</text>

    <!-- Row 3 (MANUAL CHECK) -->
    <rect x="0" y="146" width="1120" height="50" fill="#1a202e" rx="4"/>
    <text x="15" y="176" fill="#f8fafc" font-size="12" font-weight="700">P1_03</text>
    <rect x="80" y="162" width="65" height="20" rx="4" fill="#252e42"/>
    <text x="112" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">language</text>
    <text x="210" y="171" fill="#f8fafc" font-size="12" font-weight="600">Language - Delay nút Done 1500ms</text>
    <text x="210" y="187" fill="#94a3b8" font-size="11">Chống click nhầm vào quảng cáo</text>
    <text x="450" y="176" fill="#cbd5e1" font-size="12">Sau khi chọn ngôn ngữ bất kỳ -> delay nút Done 1500ms</text>
    <text x="800" y="176" fill="#fde68a" font-size="12">Cần tester bấm thử trên máy để cảm nhận delay 1.5s</text>
    <rect x="990" y="160" width="100" height="22" rx="4" fill="#78350f" stroke="#d97706"/>
    <text x="1040" y="175" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">MANUAL CHECK</text>

    <!-- Row 4 (FAIL) -->
    <rect x="0" y="200" width="1120" height="50" fill="#161b27" rx="4"/>
    <text x="15" y="230" fill="#f8fafc" font-size="12" font-weight="700">P1_05</text>
    <rect x="80" y="216" width="45" height="20" rx="4" fill="#252e42"/>
    <text x="102" y="230" fill="#94a3b8" font-size="11" text-anchor="middle">onb</text>
    <text x="210" y="225" fill="#f8fafc" font-size="12" font-weight="600">Onboarding - 4 Trang &amp; Vị trí Ads</text>
    <text x="210" y="241" fill="#f8fafc" font-size="11">Native trang 1, 4 &amp; Fullscreen</text>
    <text x="450" y="230" fill="#cbd5e1" font-size="12">Hiển thị đủ 4 trang. Có native_onboarding_fullscreen_1_1</text>
    <text x="800" y="230" fill="#fca5a5" font-size="12">❌ Thiếu ID native_onboarding_fullscreen_1_1 trong ad_config.json</text>
    <rect x="1005" y="214" width="70" height="22" rx="4" fill="#7f1d1d" stroke="#dc2626"/>
    <text x="1040" y="229" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">FAIL</text>

    <!-- Row 5 (PASS) -->
    <rect x="0" y="254" width="1120" height="50" fill="#1a202e" rx="4"/>
    <text x="15" y="284" fill="#f8fafc" font-size="12" font-weight="700">P1_08</text>
    <rect x="80" y="270" width="45" height="20" rx="4" fill="#252e42"/>
    <text x="102" y="284" fill="#94a3b8" font-size="11" text-anchor="middle">ads</text>
    <text x="210" y="279" fill="#f8fafc" font-size="12" font-weight="600">Inter Welcome Back (Exclusion)</text>
    <text x="210" y="295" fill="#94a3b8" font-size="11">ResumeAdsEntryRule</text>
    <text x="450" y="284" fill="#cbd5e1" font-size="12">Không hiển thị tại Splash, Language, Onboarding, Uninstall</text>
    <text x="800" y="284" fill="#6ee7b7" font-size="12">Đã phát hiện khai báo ResumeAdsEntryRule chuẩn</text>
    <rect x="1005" y="268" width="70" height="22" rx="4" fill="#064e3b" stroke="#059669"/>
    <text x="1040" y="283" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">PASS</text>
