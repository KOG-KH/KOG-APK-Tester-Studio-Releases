<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%" style="background:#0c0f18; font-family:'Segoe UI', -apple-system, sans-serif;">
  <text x="500" y="40" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">CƠ CHẾ ĐỒNG BỘ STUDY CASES QUA GOOGLE DRIVE (CHO 3 TESTER)</text>
  <text x="500" y="65" fill="#94a3b8" font-size="13" text-anchor="middle">Khi 1 tester note lỗi lọt lưới, 2 tester còn lại tự động nhận được bài học kinh nghiệm</text>

  <!-- Google Drive Center Cloud -->
  <g transform="translate(375, 110)">
    <rect x="0" y="0" width="250" height="130" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="125" y="38" fill="#38bdf8" font-size="28" text-anchor="middle">☁️</text>
    <text x="125" y="70" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">THƯ MỤC GOOGLE DRIVE CHUNG</text>
    <text x="125" y="90" fill="#94a3b8" font-size="11" text-anchor="middle">QA_Team_Sync / study_cases.json</text>
    <rect x="45" y="102" width="160" height="18" rx="9" fill="#0369a1"/>
    <text x="125" y="115" fill="#e0f2fe" font-size="10" font-weight="600" text-anchor="middle">🔄 Tự động hợp nhất 2 chiều</text>
  </g>

  <!-- Tester 1 -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="250" height="150" rx="10" fill="#181c27" stroke="#252d40"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#4338ca"/>
    <text x="125" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">💻 MÁY TESTER 1 (Phát hiện Bug)</text>
    <text x="15" y="55" fill="#e2e8f0" font-size="12">• Test thực tế có bug lọt lưới</text>
    <text x="15" y="75" fill="#fde68a" font-size="11">⚠️ Bấm "Tạo Study Case"</text>
    <text x="15" y="95" fill="#94a3b8" font-size="11">• Nhập mô tả bug + link ảnh</text>
    <rect x="15" y="112" width="220" height="26" rx="4" fill="#059669"/>
    <text x="125" y="129" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Lưu -> Đẩy lên Google Drive</text>
  </g>

  <!-- Line from Tester 1 to Cloud -->
  <path d="M 175 270 L 175 210 L 375 175" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="375,175 363,168 365,180" fill="#4f46e5"/>

  <!-- Tester 2 -->
  <g transform="translate(375, 270)">
    <rect x="0" y="0" width="250" height="150" rx="10" fill="#181c27" stroke="#252d40"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#1d4ed8"/>
    <text x="125" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">💻 MÁY TESTER 2</text>
    <text x="15" y="55" fill="#e2e8f0" font-size="12">• Tự động đồng bộ ngầm</text>
    <text x="15" y="75" fill="#38bdf8" font-size="11">🟢 Đã nhận Case từ Tester 1</text>
    <text x="15" y="95" fill="#94a3b8" font-size="11">• Mở mục Study Cases xem ngay</text>
    <rect x="15" y="112" width="220" height="26" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="125" y="129" fill="#94a3b8" font-size="11" text-anchor="middle">Đồng bộ hoàn tất</text>
  </g>

  <!-- Line from Cloud to Tester 2 -->
  <path d="M 500 240 L 500 270" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="500,270 495,258 505,258" fill="#38bdf8"/>

  <!-- Tester 3 -->
  <g transform="translate(700, 270)">
    <rect x="0" y="0" width="250" height="150" rx="10" fill="#181c27" stroke="#252d40"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#047857"/>
    <text x="125" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">💻 MÁY TESTER 3 (Quét bản v2)</text>
    <text x="15" y="55" fill="#e2e8f0" font-size="12">• Tester 3 kéo thả file APK v2</text>
    <rect x="15" y="72" width="220" height="40" rx="4" fill="#451a03" stroke="#b45309"/>
    <text x="25" y="88" fill="#fde68a" font-size="10" font-weight="700">⚠️ BẬT CẢNH BÁO TIỀN SỬ:</text>
    <text x="25" y="102" fill="#fef3c7" font-size="9">Soi kỹ lỗi Tester 1 đã từng bắt!</text>
  </g>

  <!-- Line from Cloud to Tester 3 -->
  <path d="M 625 175 L 825 210 L 825 270" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="825,270 820,258 830,258" fill="#10b981"/>
</svg>
