<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0f111a; font-family:'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <text x="500" y="45" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">QUY TRÌNH 1-CLICK XUẤT KẾT QUẢ VÀO GOOGLE SHEET ĐỐI TÁC</text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">Không cần gõ tay - Dữ liệu dạng TSV tự động dàn đều vào 10 cột chuẩn của file đối tác</text>

  <!-- Step 1: Tool Screen -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="260" height="280" rx="10" fill="#181c27" stroke="#2a3248"/>
    <rect x="0" y="0" width="260" height="34" rx="10" fill="#202636"/>
    <text x="130" y="22" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">BƯỚC 1: QUÉT &amp; ĐÁNH GIÁ</text>
    
    <text x="20" y="65" fill="#e2e8f0" font-size="12" font-weight="600">Ứng dụng: AI Cleaner</text>
    <text x="20" y="85" fill="#94a3b8" font-size="11">Phát hiện 3 lỗi cấu hình</text>

    <rect x="15" y="110" width="230" height="40" rx="6" fill="#12151f" stroke="#252c40"/>
    <text x="25" y="128" fill="#fca5a5" font-size="11" font-weight="600">❌ P1_05: Thiếu fullscreen_1_1</text>
    <text x="25" y="142" fill="#94a3b8" font-size="10">ad_config.json chưa khai báo</text>

    <rect x="15" y="160" width="230" height="40" rx="6" fill="#12151f" stroke="#252c40"/>
    <text x="25" y="178" fill="#fde68a" font-size="11" font-weight="600">⚠️ P1_03: Cần test delay Done</text>
    <text x="25" y="192" fill="#94a3b8" font-size="10">Tester xác nhận trên máy</text>

    <!-- Copy Button -->
    <rect x="25" y="220" width="210" height="38" rx="6" fill="#059669"/>
    <text x="130" y="244" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">📋 Bấm "Copy cho Google Sheet"</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(325, 235)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#4f46e5" stroke-width="3" stroke-dasharray="4,2"/>
    <polygon points="60,-6 72,0 60,6" fill="#4f46e5"/>
    <text x="35" y="-12" fill="#818cf8" font-size="11" font-weight="600" text-anchor="middle">Tự copy TSV</text>
  </g>

  <!-- Step 2: Clipboard -->
  <g transform="translate(410, 150)">
    <rect x="0" y="0" width="180" height="200" rx="10" fill="#1e2433" stroke="#3b82f6" stroke-dasharray="4,4"/>
    <text x="90" y="30" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">BƯỚC 2: BỘ NHỚ TẠM</text>
    <text x="90" y="70" fill="#ffffff" font-size="28" text-anchor="middle">📋</text>
    <text x="90" y="110" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Dữ liệu TSV sẵn sàng</text>
    <text x="90" y="130" fill="#94a3b8" font-size="11" text-anchor="middle">Khớp 10 cột chuẩn</text>
    <text x="90" y="170" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Chỉ cần bấm Ctrl + V</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(605, 235)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#059669" stroke-width="3" stroke-dasharray="4,2"/>
    <polygon points="60,-6 72,0 60,6" fill="#059669"/>
    <text x="35" y="-12" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Dán trực tiếp</text>
  </g>

  <!-- Step 3: Google Sheet Result -->
  <g transform="translate(680, 110)">
    <rect x="0" y="0" width="270" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="270" height="34" rx="10" fill="#0f9d58"/>
    <text x="135" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">BƯỚC 3: GOOGLE SHEET ĐỐI TÁC</text>
    
    <!-- Sheet Grid Representation -->
    <rect x="10" y="45" width="250" height="20" fill="#e8eaed"/>
    <text x="15" y="59" fill="#202124" font-size="9" font-weight="700">ID</text>
    <text x="65" y="59" fill="#202124" font-size="9" font-weight="700">Function</text>
    <text x="120" y="59" fill="#202124" font-size="9" font-weight="700">Scenario</text>
    <text x="190" y="59" fill="#202124" font-size="9" font-weight="700">Expected</text>
    <text x="240" y="59" fill="#202124" font-size="9" font-weight="700">R1</text>

    <!-- Row 1 -->
    <line x1="10" y1="90" x2="260" y2="90" stroke="#dadce0"/>
    <text x="15" y="80" fill="#3c4043" font-size="9">AIClean_1</text>
    <text x="65" y="80" fill="#3c4043" font-size="9">splash</text>
    <text x="120" y="80" fill="#3c4043" font-size="8">Wrong text splash</text>
    <text x="190" y="80" fill="#3c4043" font-size="8">Add text ad...</text>
    <text x="240" y="80" fill="#137333" font-size="9" font-weight="700">Pass</text>

    <!-- Row 2 -->
    <line x1="10" y1="125" x2="260" y2="125" stroke="#dadce0"/>
    <text x="15" y="115" fill="#3c4043" font-size="9">AIClean_2</text>
    <text x="65" y="115" fill="#3c4043" font-size="9">language</text>
    <text x="120" y="115" fill="#3c4043" font-size="8">Delay Done button</text>
    <text x="190" y="115" fill="#3c4043" font-size="8">Delay 1500ms...</text>
    <text x="240" y="115" fill="#b06000" font-size="9" font-weight="700">Pend</text>

    <!-- Row 3 -->
    <line x1="10" y1="160" x2="260" y2="160" stroke="#dadce0"/>
    <text x="15" y="150" fill="#3c4043" font-size="9">AIClean_3</text>
    <text x="65" y="150" fill="#3c4043" font-size="9">onb</text>
    <text x="120" y="150" fill="#3c4043" font-size="8">Thiếu native full</text>
    <text x="190" y="150" fill="#3c4043" font-size="8">Bổ sung ID...</text>
    <text x="240" y="150" fill="#c5221f" font-size="9" font-weight="700">Fail</text>

    <!-- Bottom note -->
    <rect x="10" y="235" width="250" height="32" rx="4" fill="#e6f4ea"/>
    <text x="135" y="255" fill="#137333" font-size="10" font-weight="600" text-anchor="middle">✅ Đã điền 18 dòng thành công!</text>
  </g>
</svg>
